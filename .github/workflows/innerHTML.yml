name: Unsafe innerHTML checker
on: [pull_request]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.js
      - if: steps.changed.outputs.any_changed == 'true'
        run: |
          set +e
          OUTPUT=$(npx eslint ${{ steps.changed.outputs.all_changed_files }} 2>&1)
          set -e
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Unsafe innerHTML"; then
            echo "::error::Unsafe innerHTML found in this pr"
            exit 1
          fi
          echo "No innerHTML issues"
